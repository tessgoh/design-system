<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <style>
    /* ===== Design Tokens ===== */
    :root {
      /* Colors - Base */
      --color-white: #FFFFFF;
      --color-black: #000000;

      /* Colors - Gray (light mode) */
      --color-gray-25: #F9F9F9;
      --color-gray-50: #F5F5F5;
      --color-gray-100: #EEEEEE;
      --color-gray-200: #E1E1E1;
      --color-gray-300: #D3D3D3;
      --color-gray-400: #BFBFBF;
      --color-gray-500: #888888;
      --color-gray-600: #6E6E6E;
      --color-gray-700: #555555;
      --color-gray-800: #333333;
      --color-gray-900: #222222;
      --color-gray-950: #111111;

      /* Colors - Brand */
      --color-brand-25: #F6FEF9;
      --color-brand-50: #E7FAEC;
      --color-brand-100: #C9FCD6;
      --color-brand-200: #95F9B8;
      --color-brand-300: #5FEE9F;
      --color-brand-400: #37DD92;
      --color-brand-500: #00C781;
      --color-brand-600: #00AB7F;
      --color-brand-700: #008F79;
      --color-brand-800: #00736D;
      --color-brand-900: #005B5F;
      --color-brand-950: #084647;

      /* Colors - Error */
      --color-error-25: #FFFBFA;
      --color-error-300: #FFA795;
      --color-error-500: #FF4F4F;
      --color-error-600: #DB3947;

      /* Spacing */
      --spacing-0: 0px;
      --spacing-1: 4px;
      --spacing-2: 8px;
      --spacing-3: 12px;
      --spacing-4: 16px;
      --spacing-5: 20px;
      --spacing-6: 24px;
      --spacing-8: 32px;
      --spacing-10: 40px;
      --spacing-12: 48px;
      --spacing-16: 64px;
      --spacing-20: 80px;

      /* Border Radius */
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;

      /* Shadows */
      --shadow-xs: 0px 1px 2px 0px rgba(16, 24, 40, 0.05);
      --shadow-sm: 0px 1px 2px -1px rgba(16, 24, 40, 0.1), 0px 1px 3px 0px rgba(16, 24, 40, 0.1);
      --shadow-lg: 0px 2px 2px -1px rgba(16, 24, 40, 0.04), 0px 4px 6px -2px rgba(16, 24, 40, 0.03), 0px 12px 16px -4px rgba(16, 24, 40, 0.08);
      --shadow-xl: 0px 3px 3px -1.5px rgba(16, 24, 40, 0.04), 0px 8px 8px -4px rgba(16, 24, 40, 0.03), 0px 20px 24px -4px rgba(16, 24, 40, 0.08);
      --shadow-focus-ring: 0px 0px 0px 4px #00C781, 0px 0px 0px 2px #FFFFFF;
      --shadow-focus-ring-error: 0px 0px 0px 4px rgba(255, 79, 79, 0.24), 0px 0px 0px 2px #FFFFFF;

      /* Typography */
      --font-family: "Pretendard Variable", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    /* ===== Reset & Base ===== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--color-gray-25);
      color: var(--color-gray-900);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== Login Container ===== */
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: var(--spacing-6);
    }

    /* ===== Login Card ===== */
    .login-card {
      background-color: var(--color-white);
      border: 1px solid var(--color-gray-100);
      border-radius: var(--radius-xl);
      padding: var(--spacing-10);
      box-shadow: var(--shadow-xl);
    }

    /* ===== Header ===== */
    .login-header {
      text-align: center;
      margin-bottom: var(--spacing-8);
    }

    .login-logo {
      width: 48px;
      height: 48px;
      background-color: var(--color-brand-500);
      border-radius: var(--radius-lg);
      margin: 0 auto var(--spacing-6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-logo svg {
      width: 24px;
      height: 24px;
      fill: var(--color-white);
    }

    .login-title {
      font-size: 24px;
      font-weight: 600;
      line-height: 32px;
      letter-spacing: 0px;
      color: var(--color-gray-950);
      margin-bottom: var(--spacing-2);
    }

    .login-subtitle {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--color-gray-600);
    }

    /* ===== Form ===== */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-5);
    }

    /* ===== Form Group ===== */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-1);
    }

    .form-label {
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      color: var(--color-gray-800);
    }

    .form-input {
      font-family: var(--font-family);
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      color: var(--color-gray-900);
      background-color: var(--color-white);
      border: 1px solid var(--color-gray-300);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input::placeholder {
      color: var(--color-gray-400);
    }

    .form-input:hover {
      border-color: var(--color-gray-400);
    }

    .form-input:focus {
      border-color: var(--color-brand-500);
      box-shadow: 0px 0px 0px 4px rgba(0, 199, 129, 0.16), 0px 0px 0px 2px var(--color-white);
    }

    .form-input.error {
      border-color: var(--color-error-500);
    }

    .form-input.error:focus {
      border-color: var(--color-error-500);
      box-shadow: var(--shadow-focus-ring-error);
    }

    .form-hint {
      font-size: 13px;
      font-weight: 400;
      line-height: 19px;
      color: var(--color-gray-500);
    }

    .form-error {
      font-size: 13px;
      font-weight: 400;
      line-height: 19px;
      color: var(--color-error-600);
    }

    /* ===== Password extras ===== */
    .password-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .forgot-password {
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      color: var(--color-brand-600);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .forgot-password:hover {
      color: var(--color-brand-700);
    }

    /* ===== Input wrapper (for password toggle) ===== */
    .input-wrapper {
      position: relative;
    }

    .input-wrapper .form-input {
      width: 100%;
      padding-right: 44px;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-gray-500);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
    }

    .password-toggle:hover {
      color: var(--color-gray-700);
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
    }

    /* ===== Button ===== */
    .btn-primary {
      font-family: var(--font-family);
      font-size: 16px;
      font-weight: 600;
      line-height: 24px;
      color: var(--color-white);
      background-color: var(--color-brand-500);
      border: none;
      border-radius: var(--radius-md);
      padding: 10px var(--spacing-5);
      cursor: pointer;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: var(--shadow-xs);
    }

    .btn-primary:hover {
      background-color: var(--color-brand-600);
    }

    .btn-primary:focus-visible {
      outline: none;
      box-shadow: 0px 0px 0px 4px rgba(0, 199, 129, 0.16), 0px 0px 0px 2px var(--color-white), var(--shadow-xs);
    }

    .btn-primary:active {
      background-color: var(--color-brand-700);
    }

    /* ===== Divider ===== */
    .divider {
      display: flex;
      align-items: center;
      gap: var(--spacing-3);
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: var(--color-gray-200);
    }

    .divider-text {
      font-size: 13px;
      font-weight: 400;
      line-height: 19px;
      color: var(--color-gray-500);
      white-space: nowrap;
    }

    /* ===== Social Buttons ===== */
    .social-buttons {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-3);
    }

    .btn-social {
      font-family: var(--font-family);
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      color: var(--color-gray-800);
      background-color: var(--color-white);
      border: 1px solid var(--color-gray-300);
      border-radius: var(--radius-md);
      padding: 10px var(--spacing-4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-3);
      transition: background-color 0.15s ease, border-color 0.15s ease;
      box-shadow: var(--shadow-xs);
    }

    .btn-social:hover {
      background-color: var(--color-gray-50);
      border-color: var(--color-gray-400);
    }

    .btn-social:focus-visible {
      outline: none;
      box-shadow: 0px 0px 0px 4px rgba(0, 199, 129, 0.16), 0px 0px 0px 2px var(--color-white), var(--shadow-xs);
    }

    .btn-social svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* ===== Footer ===== */
    .login-footer {
      text-align: center;
      margin-top: var(--spacing-8);
    }

    .login-footer-text {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--color-gray-600);
    }

    .login-footer-link {
      font-weight: 600;
      color: var(--color-brand-600);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .login-footer-link:hover {
      color: var(--color-brand-700);
    }

    /* ===== Responsive ===== */
    @media (max-width: 480px) {
      .login-container {
        padding: var(--spacing-4);
      }

      .login-card {
        padding: var(--spacing-6);
        border-radius: var(--radius-lg);
      }

      .login-title {
        font-size: 20px;
        line-height: 30px;
      }
    }
  </style>
</head>
<body>
  <main class="login-container">
    <div class="login-card">
      <!-- Header -->
      <div class="login-header">
        <div class="login-logo">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="white"/>
            <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="login-title">로그인</h1>
        <p class="login-subtitle">계정에 로그인하여 서비스를 이용하세요.</p>
      </div>

      <!-- Login Form -->
      <form class="login-form" onsubmit="return false;">
        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="email">이메일</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="name@example.com"
            autocomplete="email"
          >
        </div>

        <!-- Password -->
        <div class="form-group">
          <div class="password-header">
            <label class="form-label" for="password">비밀번호</label>
            <a href="#" class="forgot-password">비밀번호 찾기</a>
          </div>
          <div class="input-wrapper">
            <input
              class="form-input"
              type="password"
              id="password"
              name="password"
              placeholder="비밀번호를 입력하세요"
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="비밀번호 표시">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-primary">로그인</button>

        <!-- Divider -->
        <div class="divider">
          <span class="divider-text">또는</span>
        </div>

        <!-- Social Login -->
        <div class="social-buttons">
          <button type="button" class="btn-social">
            <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path d="M19.8 10.2c0-.7-.1-1.4-.2-2H10v3.8h5.5a4.7 4.7 0 0 1-2 3.1v2.6h3.3c1.9-1.8 3-4.4 3-7.5z" fill="#4285F4"/>
              <path d="M10 20c2.7 0 5-.9 6.7-2.4l-3.3-2.6c-.9.6-2.1 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H1v2.6A10 10 0 0 0 10 20z" fill="#34A853"/>
              <path d="M4.4 11.9c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V5.5H1A10 10 0 0 0 0 10c0 1.6.4 3.1 1 4.5l3.4-2.6z" fill="#FBBC05"/>
              <path d="M10 4c1.5 0 2.8.5 3.9 1.5L17 2.3A10 10 0 0 0 10 0 10 10 0 0 0 1 5.5l3.4 2.6C5.2 5.8 7.4 4 10 4z" fill="#EA4335"/>
            </svg>
            Google로 계속하기
          </button>
          <button type="button" class="btn-social">
            <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <rect width="20" height="20" rx="4" fill="#FEE500"/>
              <path d="M10 4.5c-3.6 0-6.5 2.3-6.5 5.2 0 1.8 1.2 3.4 3 4.3l-.8 2.9c-.1.2.2.4.4.3l3.4-2.3h.5c3.6 0 6.5-2.3 6.5-5.2S13.6 4.5 10 4.5z" fill="#3C1E1E"/>
            </svg>
            카카오로 계속하기
          </button>
        </div>
      </form>

      <!-- Footer -->
      <div class="login-footer">
        <p class="login-footer-text">
          계정이 없으신가요? <a href="#" class="login-footer-link">회원가입</a>
        </p>
      </div>
    </div>
  </main>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.9 17.9A10.1 10.1 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }
  </script>
</body>
</html>
